# The controlled baseline: plain concat + residual separable CNN.
#
# Identical to default.yaml in data, loss, schedule and seed. The only
# difference is `model.name`, which is what makes the comparison controlled.
#
# Output head: sigmoid (see fusionedge/models/baseline.py for why). The first
# attempt used clamp(0,1) and could not train -- 58% of output pixels sat on the
# clamp boundary where the gradient is zero. Evidence preserved in
# experiments/_failed/baseline_clamp_bug/. The correction makes THIS model
# stronger; FusionEdge never had the problem.
#
# Precision: bfloat16, not float16 (inherited from default.yaml). A previous run
# used fp16 and silently trained on almost nothing -- the GradScaler scale
# collapsed to 0, skipping nearly every optimizer step while the loss curve
# still looked like plausible noise. Evidence in
# experiments/_failed/baseline_fp16_amp/.
_base_: default.yaml

run_name: baseline_simplecnn_v6

model:
  name: baseline
  cfg:
    width: 32
    depth: 4
    use_relu_head: false   # v1-v3 had LeakyReLU before the sigmoid (handicap)
    output_space: y        # fuse luminance, keep visible chroma (v4 invented false colour)
