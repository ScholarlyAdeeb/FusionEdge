# FusionEdge -- default run configuration.
#
# Every field here is overridden by the experiment configs in this directory via
# `_base_`, so the baseline and the custom model provably share data pipeline,
# loss, schedule and seed. Only `run_name`, `model` and the ablation flags differ.
#
# Budget note: this was tuned for an RTX 4070 Laptop (8 GiB). `data.batch_size`
# and `data.crop` interact; if you see an OOM, lower batch_size first, then crop.

run_name: default
seed: 1234
deterministic: true      # kernel determinism ON for training; benchmarks override
device: cuda

dataset:
  # Provenance registry id (see data/registry/*.json). MSRS uses its own
  # published train/test partition, so eval_split 'val' below is the MSRS
  # `test/` directory -- no method trains on it.
  id: MSRS
  train_split: train
  eval_split: val

model:
  name: fusionedge
  cfg: {}

data:
  batch_size: 8
  num_workers: 4
  crop: 128               # training crop size; eval always uses full images
  limit_train: null
  limit_eval: null
  # Evaluation protocol (2026-10-13). Per-epoch validation and best.pt selection
  # use a fixed 10% holdout of MSRS train/ (deterministic sha1 ranking, ids
  # written to <run>/holdout_manifest.json). The MSRS test/ split (`eval_split`)
  # is evaluated ONCE, after training, and never influences any choice.
  # Earlier runs (v1-v3) validated and selected on test/ -- not comparable.
  holdout_frac: 0.1
  holdout_seed: 0

train:
  epochs: 60
  lr: 1.0e-4
  optimizer: adam
  weight_decay: 0.0
  scheduler: cosine
  eta_min: 1.0e-6
  grad_clip: 1.0

  # Mixed precision.
  #
  #   amp_dtype: bfloat16 | float16 | float32   (default bfloat16)
  #   amp: true | false                          (amp:false forces fp32)
  #
  # bfloat16, not float16. An earlier run used fp16 and silently failed: the
  # GradScaler scale collapsed from 32768 to 0 within 50 steps because gradients
  # overflowed, so nearly every optimizer step was skipped while the loss curve
  # still looked plausible. Measured from the identical checkpoint over 250
  # steps: fp16 improved the loss 1.4%, fp32 improved it 39.9%.
  # bfloat16 has fp32's exponent range, so it does not overflow here, and it
  # needs no loss scaling. Evidence: experiments/_failed/.
  #
  # Set amp: false for an fp32 baseline. Training now aborts if it sees a streak
  # of non-finite values, rather than reporting a result from a diverged run.
  amp: true
  amp_dtype: bfloat16
  max_nonfinite_streak: 25

  eval_every: 5
  eval_max_images: null   # set to an int to cap evaluation cost on long runs
  best_metric: MS_SSIM_ir # the ONE metric `best.pt` is selected on (holdout)
  # Which checkpoint is reported on test/: `last` = same fixed budget for every
  # model, no selection at all. best.pt is still saved for inspection.
  final_weights: last

  # Progress bar: auto | always | never
  #   auto   - show only when stderr is an interactive terminal (default).
  #            Background/CI runs stay quiet so log.txt has no escape codes.
  #   always - force the bar even when redirected.
  #   never  - never show it.
  # To watch a run, either run it in your own terminal (auto works), or set
  # `progress: always` here / pass --set train.progress=always.
  progress: auto

loss:
  w_intensity: 8.0
  w_gradient: 10.0
  w_ssim: 2.0
  w_edge: 1.0
  w_color: 1.0
  use_edge: true

benchmark:
  warmup: 50
  iters: 200
  sizes: [[128, 128], [480, 640]]
  dtype: float32