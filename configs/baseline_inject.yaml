# Attribution control: the baseline backbone (identical to baseline.yaml) with
# FusionEdge's IR-injection head (fusionedge/models/colour.py: inject_ir),
# zero-initialised exactly like FusionEdge's. Recorded in docs/PROTOCOL.md before
# it was run. Against baseline v6 it measures the HEAD; against fusionedge_main it
# measures the FusionEdge BACKBONE (cross-modal exchange, SE, edge-guided gate)
# with the head held fixed.
#
# Identical to default.yaml in data, loss, schedule and seed; differs from
# baseline.yaml only in output_space.
_base_: default.yaml

run_name: baseline_simplecnn_inject

model:
  name: baseline
  cfg:
    width: 32
    depth: 4
    use_relu_head: false
    output_space: inject
